# 200 GiB of locked memory for user managers, so rootless podman containers can
# mlock large model weights (Strata mlocks tens of GB of experts).
# Takes effect when user@<uid>.service restarts: with lingering on, logging out
# is not enough; run `sudo systemctl restart user@<uid>.service` or reboot.
[Service]
LimitMEMLOCK=200G
