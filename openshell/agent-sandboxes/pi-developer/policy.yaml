# pi-developer — feature-developer agent sandbox policy
#
# This is the agent's network contract (enforcement). The GitHub credential
# boundary is owned by the `github-feature` provider profile
# (agent-sandboxes/profiles/github-feature.yaml); its endpoints are composed
# into the effective policy on attachment and are the ONLY endpoints where
# the GITHUB_TOKEN placeholder resolves. Keep the two in sync.
#
# Composition semantics: allow rules from overlapping endpoints are unioned;
# deny rules always win; a broad read-only endpoint does not block narrower
# explicit allows on more specific paths.

version: 1

# --- Sandbox setup configuration (queried once at startup) ---

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# --- Network policies (queried per-CONNECT request) ---

network_policies:
  # Git Smart HTTP over HTTPS: clone/fetch + push (feature delivery needs writes)
  github_git_https:
    name: github-git-https
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          # Discovery (query string is included in path matching)
          - allow:
              method: GET
              path: "/**/info/refs*"
          # Reads: clone / fetch / pull
          - allow:
              method: POST
              path: "/**/git-upload-pack"
          # Writes: push
          - allow:
              method: POST
              path: "/**/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }

  # GitHub REST API — broad read for gh/curl (repo metadata, PRs, issues, branches)
  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/curl }

  # GitHub writes — repo-scoped PR lifecycle only (create/edit/close + comments)
  github_pr_writes:
    name: github-pr-writes
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        path: /repos/JayceDugan/**
        rules:
          # Create PR
          - allow:
              method: POST
              path: "/repos/JayceDugan/*/pulls"
          # Close / reopen / edit PR
          - allow:
              method: PATCH
              path: "/repos/JayceDugan/*/pulls/*"
          # Add / edit comments (PRs and issues)
          - allow:
              method: POST
              path: "/repos/JayceDugan/*/issues/*/comments"
          - allow:
              method: PATCH
              path: "/repos/JayceDugan/*/issues/comments/*"
      - host: api.github.com
        port: 443
        protocol: graphql
        tls: terminate
        enforcement: enforce
        path: /graphql
        rules:
          - allow:
              operation_type: query
          - allow:
              operation_type: mutation
              fields:
                - createPullRequest
                - updatePullRequest
                - closePullRequest
                - reopenPullRequest
                - addComment
                - updateComment
                - deleteComment
        deny_rules:
          - operation_type: mutation
            fields:
              - deleteRepository
              - deleteRef
              - updateBranchProtectionRule
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/curl }

  # Python tooling (uv / venv / pip)
  # github.com + api.github.com are credentialed hosts (github provider), so
  # uv's access to them must be L7-inspected (not L4-only).
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      # uv python install downloads from python-build-standalone on GitHub
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - { host: objects.githubusercontent.com, port: 443 }
      # uv resolves python-build-standalone release metadata via the GitHub API
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: /sandbox/.venv/bin/pip }
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python3 }
      - { path: /app/.venv/bin/pip }
      - { path: /usr/local/bin/uv }
      # Managed Python installations from uv python install
      - { path: "/sandbox/.uv/python/**" }
