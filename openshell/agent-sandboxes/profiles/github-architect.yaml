# GitHub — ARCHITECT / PLANNING role profile
#
# Credential boundary + network contract for read-only planning agents:
# they explore repositories, issues, PRs, and history to plan work, but
# cannot write anything.
#
#   Import:       openshell provider profile import --file profiles/github-architect.yaml
#   Create prov:  GITHUB_TOKEN=ghp_... openshell provider create --name github-architect --type github-architect --credential GITHUB_TOKEN

id: github-architect
display_name: GitHub (architect / planning)
description: Read-only GitHub access for planning and architecture work
category: source_control
credentials:
  - name: api_token
    description: GitHub token
    env_vars:
      - GITHUB_TOKEN
      - GH_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  # Git Smart HTTP: clone/fetch only
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
      - allow:
          method: OPTIONS
          path: '**'
      - allow:
          method: POST
          path: /**/git-upload-pack
  # REST API: read-only
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  # GraphQL: queries only
  - host: api.github.com
    port: 443
    protocol: graphql
    enforcement: enforce
    path: /graphql
    rules:
      - allow:
          operation_type: query
binaries:
  - /usr/bin/gh
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/local/bin/git
discovery:
  credentials:
    - api_token
