id: unsloth-openai                     # new ID so it can't be confused with the stock examples
display_name: Unsloth Studio (local)
description: Host-local Unsloth Studio OpenAI-compatible API (llama-server), key-authenticated
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Unsloth Studio API key (sk-unsloth-...)
    env_vars: [UNSLOTH_API_KEY]        # the var your workload reads inside the sandbox
    required: true
    auth_style: bearer                 # sent as Authorization: Bearer <placeholder>
    header_name: authorization

discovery:
  credentials: [api_key]               # lets --from-existing pick it up from your shell

endpoints:
  - host: host.openshell.internal      # NOT 127.0.0.1 / localhost — unreachable from the sandbox
    port: 8888                         # Unsloth Studio default; use 8000 for the Docker image
    path: /v1/**                       # binds the key to /v1 and descendants only
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:                              # least-privilege: name the real paths in YOUR image
  - /usr/bin/curl
  - /usr/local/bin/curl
  - /usr/bin/python3
  - /usr/local/bin/python
  - /sandbox/.uv/python/**
  - /sandbox/.venv/**
