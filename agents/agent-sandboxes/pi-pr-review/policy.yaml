# pi-pr-review — PR review agent sandbox policy
#
# Read-only for code: git clone/fetch only (no git-receive-pack), broad REST
# reads, and repo-scoped review writes (comments + formal reviews). The
# credential boundary is owned by the `github-review` provider profile
# (agent-sandboxes/profiles/github-review.yaml); keep the two in sync.
#
# A different GITHUB_TOKEN for this role does NOT require a policy change —
# tokens live on providers, not in this file. See agent-sandboxes/README.md,
# "Using a different GitHub token".

version: 1

# --- Sandbox setup configuration (queried once at startup) ---

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# --- Network policies (queried per-CONNECT request) ---

network_policies:
  # Git Smart HTTP over HTTPS: clone/fetch only — NO git-receive-pack (no push)
  github_git_read:
    name: github-git-read
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          # Discovery (query string is included in path matching)
          - allow:
              method: GET
              path: "/**/info/refs*"
          # Reads: clone / fetch
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - { path: /usr/bin/git }

  # GitHub REST API — broad read for gh/curl
  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/curl }

  # Review writes — repo-scoped comments and formal reviews only
  github_review_writes:
    name: github-review-writes
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        path: /repos/JayceDugan/**
        rules:
          # Add / edit comments (PRs and issues)
          - allow:
              method: POST
              path: "/repos/JayceDugan/*/issues/*/comments"
          - allow:
              method: PATCH
              path: "/repos/JayceDugan/*/issues/comments/*"
          # Formal reviews (create + submit; approve / request-changes / comment)
          - allow:
              method: POST
              path: "/repos/JayceDugan/*/pulls/*/reviews"
          - allow:
              method: POST
              path: "/repos/JayceDugan/*/pulls/*/reviews/*/events"
      - host: api.github.com
        port: 443
        protocol: graphql
        tls: terminate
        enforcement: enforce
        path: /graphql
        rules:
          - allow:
              operation_type: query
          # gh pr review maps to GraphQL mutations, not REST
          - allow:
              operation_type: mutation
              fields:
                - addPullRequestReview
                - submitPullRequestReview
                - updatePullRequestReview
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/curl }

  # Python tooling (uv / venv / pip)
  # github.com + api.github.com are credentialed hosts (github-review
  # provider), so uv's access to them must be L7-inspected (not L4-only).
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      # uv python install downloads from python-build-standalone on GitHub
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - { host: objects.githubusercontent.com, port: 443 }
      # uv resolves python-build-standalone release metadata via the GitHub API
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: /sandbox/.venv/bin/pip }
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python3 }
      - { path: /app/.venv/bin/pip }
      - { path: /usr/local/bin/uv }
      # Managed Python installations from uv python install
      - { path: "/sandbox/.uv/python/**" }
